name: ci
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  law:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lexical substrate law tests
        run: node tests/test_lexicon.js
